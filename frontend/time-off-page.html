<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="auth-guard.js"></script>
    <script src="js/api.js"></script>
    <title>Modern Tech HR Portal - Time Off</title>
    <link rel="stylesheet" href="combined-styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page-leave">
    <nav
      class="nav"
      style="width: 100%; position: fixed; top: 0; left: 0; z-index: 999"
    >
      <div class="logo">Modern<span>Tech</span></div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-bar">
        <ul class="nav-content">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="employees.html">Employees</a></li>
          <li><a href="payroll.html">Payroll</a></li>
          <li class="active"><a href="time-off-page.html">Time Off</a></li>
          <li><a href="Modern Tech/attendance.html">Attendance</a></li>
          <li><a href="performance-reviews.html">Performance Reviews</a></li>
          <li>
            <a
              href="#"
              onclick="
                localStorage.removeItem('moderntech_token');
                localStorage.removeItem('moderntech_auth');
                window.location.href = 'index.html';
                return false;
              "
              >Logout</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="main" style="margin-top: 80px">
      <div class="header">
        <div>
          <h1>Time Off</h1>
          <p>Manage leave requests and approvals</p>
        </div>
      </div>

      <div class="action-container">
        <button class="btn btn-primary" id="newRequestBtn">
          + New Request
        </button>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">
          All <span id="count-all">0</span>
        </button>
        <button class="tab" data-filter="pending">
          Pending <span id="count-pending">0</span>
        </button>
        <button class="tab" data-filter="approved">
          Approved <span id="count-approved">0</span>
        </button>
        <button class="tab" data-filter="denied">
          Denied <span id="count-denied">0</span>
        </button>
      </div>

      <div id="pageError" class="error-message" style="display:none"></div>

      <div id="cards-container">
        <p id="cards-loading">Loading leave requests…</p>
      </div>
    </main>

    <div id="requestModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>New Leave Request</h3>
          <span class="close">&times;</span>
        </div>

        <form id="leaveForm">
          <label>Employee</label>
          <select id="employee" required>
            <option value="">Loading employees…</option>
          </select>

          <label>Leave Type</label>
          <select id="leaveType" required>
            <option>Annual Leave</option>
            <option>Sick Leave</option>
            <option>Family Responsibility</option>
            <option>Study Leave</option>
          </select>

          <div class="date-row">
            <div>
              <label>Start Date</label>
              <input type="date" id="startDate" required />
            </div>
            <div>
              <label>End Date</label>
              <input type="date" id="endDate" required />
            </div>
          </div>

          <label>Reason</label>
          <textarea
            id="reason"
            rows="4"
            placeholder="Brief reason for leave request..."
            required
          ></textarea>

          <div class="modal-buttons">
            <button type="button" class="cancel-btn">Cancel</button>
            <button type="submit" class="submit-btn">Submit Request</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const container = document.getElementById("cards-container");
      const pageError = document.getElementById("pageError");
      const tabs = document.querySelectorAll(".tab");
      let currentFilter = "all";
      let currentRequests = []; // last data fetched from GET /api/timeoff

      // Fallback list used only if GET /api/employees isn't live yet
      // (matches backend/db/seed.sql). Remove once that endpoint ships.
      const FALLBACK_EMPLOYEES = [
        { employee_id: 1, name: "Thandiwe Nkosi", position: "HR Officer" },
        { employee_id: 2, name: "Sipho Dlamini", position: "Software Engineer" },
        { employee_id: 3, name: "Aisha Patel", position: "Sales Executive" },
      ];

      const AVATAR_COLORS = ["#ede9fe", "#dbeafe", "#fef3c7", "#dcfce7", "#fee2e2"];

      function showError(message) {
        pageError.textContent = message;
        pageError.style.display = "block";
      }

      function clearError() {
        pageError.textContent = "";
        pageError.style.display = "none";
      }

      function initials(name) {
        return name
          .split(" ")
          .filter(Boolean)
          .map((part) => part[0])
          .join("")
          .toUpperCase();
      }

      function avatarColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
        return AVATAR_COLORS[hash % AVATAR_COLORS.length];
      }

      function durationLabel(startDate, endDate) {
        const start = new Date(startDate);
        const end = new Date(endDate);
        const days = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
        return `${days} day${days > 1 ? "s" : ""}`;
      }

      function badgeFor(status) {
        const s = status.toLowerCase();
        if (s === "approved") return { cls: "badge approved", label: "✓ Approved" };
        if (s === "denied") return { cls: "badge denied", label: "⦸ Denied" };
        return { cls: "badge pending", label: "⏳ Pending" };
      }

      function requestToCardHtml(req) {
        const status = req.status.toLowerCase();
        const badge = badgeFor(req.status);
        const name = req.employee || "Unknown employee";

        const reviewedHtml = req.reviewed_at
          ? `<div class="reviewed">Reviewed on ${req.reviewed_at.slice(0, 10)}</div>`
          : "";

        const actionsHtml =
          status === "pending"
            ? `<div class="actions">
                 <button class="btn approve" data-id="${req.leave_id}">✓ Approve</button>
                 <button class="btn deny" data-id="${req.leave_id}">✕ Deny</button>
               </div>`
            : "";

        return `
      <div class="leave-card" data-status="${status}" data-id="${req.leave_id}">
        <div class="card-top">
          <div class="user-row">
            <div class="avatar-sm" style="background:${avatarColor(name)}">${initials(name)}</div>
            <div>
              <div class="name">${name}</div>
              <div class="role">${req.leave_type}</div>
            </div>
          </div>
          <div class="${badge.cls}">${badge.label}</div>
        </div>

        <div class="grid">
          <div><label>Type</label><div>${req.leave_type}</div></div>
          <div><label>Duration</label><div>${durationLabel(req.start_date, req.end_date)}</div></div>
          <div><label>From</label><div>${req.start_date.slice(0, 10)}</div></div>
          <div><label>To</label><div>${req.end_date.slice(0, 10)}</div></div>
        </div>

        <div class="reason"><strong>Reason:</strong> ${req.reason || "—"}</div>
        ${reviewedHtml}
        ${actionsHtml}
      </div>`;
      }

      function updateCounts(requests) {
        const counts = { all: requests.length, pending: 0, approved: 0, denied: 0 };
        requests.forEach((r) => {
          const key = r.status.toLowerCase();
          if (counts[key] !== undefined) counts[key]++;
        });

        document.getElementById("count-all").textContent = counts.all;
        document.getElementById("count-pending").textContent = counts.pending;
        document.getElementById("count-approved").textContent = counts.approved;
        document.getElementById("count-denied").textContent = counts.denied;
      }

      function filterCards() {
        container.querySelectorAll(".leave-card").forEach((card) => {
          card.style.display =
            currentFilter === "all" || card.dataset.status === currentFilter
              ? "block"
              : "none";
        });
      }

      function renderCards(requests) {
        currentRequests = requests;
        updateCounts(requests);

        if (!requests.length) {
          container.innerHTML = `<p>No leave requests yet.</p>`;
          return;
        }

        container.innerHTML = requests.map(requestToCardHtml).join("");
        filterCards();
      }

      async function loadLeaveRequests() {
        try {
          clearError();
          const data = await apiRequest("/timeoff");
          if (data) renderCards(data.data || []);
        } catch (err) {
          console.error("Failed to load leave requests:", err);
          container.innerHTML = "";
          showError(err.message || "Unable to load leave requests.");
        }
      }

      async function loadEmployees() {
        const select = document.getElementById("employee");
        try {
          const data = await apiRequest("/employees");
          const employees = (data && (data.data || data.employees)) || [];
          if (!Array.isArray(employees) || !employees.length) throw new Error("empty");

          select.innerHTML = employees
            .map(
              (emp) =>
                `<option value="${emp.employee_id}">${emp.name}${emp.position ? ` (${emp.position})` : ""}</option>`,
            )
            .join("");
        } catch (err) {
          // /api/employees isn't live yet — fall back to seeded demo data
          // so the form is still usable. Swap this out once it ships.
          select.innerHTML = FALLBACK_EMPLOYEES.map(
            (emp) => `<option value="${emp.employee_id}">${emp.name} (${emp.position})</option>`,
          ).join("");
        }
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          currentFilter = tab.dataset.filter;
          filterCards();
        });
      });

      container.addEventListener("click", async (e) => {
        const isApprove = e.target.classList.contains("approve");
        const isDeny = e.target.classList.contains("deny");
        if (!isApprove && !isDeny) return;

        const id = e.target.dataset.id;
        const status = isApprove ? "Approved" : "Denied";
        e.target.disabled = true;

        try {
          clearError();
          await apiRequest(`/timeoff/${id}/status`, {
            method: "PATCH",
            body: { status },
          });
          await loadLeaveRequests();
        } catch (err) {
          console.error("Failed to update leave status:", err);
          showError(err.message || "Unable to update this request.");
          e.target.disabled = false;
        }
      });

      // Modal Window Interactions
      const modal = document.getElementById("requestModal");
      const newRequestBtn = document.getElementById("newRequestBtn");
      const closeBtn = document.querySelector(".close");
      const cancelBtn = document.querySelector(".cancel-btn");

      newRequestBtn.onclick = () => (modal.style.display = "flex");
      closeBtn.onclick = () => (modal.style.display = "none");
      cancelBtn.onclick = () => (modal.style.display = "none");

      window.onclick = (e) => {
        if (e.target === modal) modal.style.display = "none";
      };

      const leaveForm = document.getElementById("leaveForm");
      const submitBtn = leaveForm.querySelector(".submit-btn");

      leaveForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const employee = document.getElementById("employee").value;
        const leaveType = document.getElementById("leaveType").value;
        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;
        const reason = document.getElementById("reason").value;

        if (endDate < startDate) {
          showError("End date must be on or after the start date.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting…";

        try {
          clearError();
          await apiRequest("/timeoff", {
            method: "POST",
            body: {
              employee: Number(employee),
              leaveType,
              startDate,
              endDate,
              reason,
            },
          });

          await loadLeaveRequests();
          modal.style.display = "none";
          leaveForm.reset();
        } catch (err) {
          console.error("Failed to submit leave request:", err);
          showError(err.message || "Unable to submit this request.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Request";
        }
      });

      loadEmployees();
      loadLeaveRequests();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
