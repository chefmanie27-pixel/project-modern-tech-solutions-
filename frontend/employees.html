<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/auth-guard.js"></script>
    <script src="js/api.js"></script>
    <title>ModernTech HR | Employee Management</title>
    <link rel="stylesheet" href="css/combined-styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="page-employees">
    <!-- Top Navigation -->
    <div class="nav">
      <div class="logo">Modern<span>Tech</span></div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-bar">
        <ul class="nav-content">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li class="active"><a href="employees.html">Employees</a></li>
          <li><a href="payroll.html">Payroll</a></li>
          <li><a href="time-off-page.html">Time Off</a></li>
          <li><a href="vue-app/attendance.html">Attendance</a></li>
          <li><a href="performance-reviews.html">Performance Reviews</a></li>
          <li>
            <a
              href="#"
              onclick="
                localStorage.removeItem('moderntech_token');
                localStorage.removeItem('moderntech_user');
                window.location.href = 'index.html';
                return false;
              "
              >Logout</a
            >
          </li>
        </ul>
      </div>
    </div>

    <!-- Core Title Headers -->
    <div class="header">
      <h1>Employee Management</h1>
      <p>View, edit, and maintain active employee listings.</p>
    </div>

    <!-- Interface Control Action Block -->
    <div class="action-container">
      <button class="btn btn-edit-mode" id="employeeBtn">Edit Employees</button>
      <button class="btn btn-add" id="addEmployeeBtn">+ Add Employee</button>
      <button
        class="btn btn-reset"
        id="resetBtn"
        title="Discard unsaved edits and reload from the server"
      >
        Reset to Defaults
      </button>
    </div>

    <!-- Main Content Presentation Table Wrapper -->
    <div class="main-content">
      <table class="employee-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Position</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Employment History</th>
            <th>Contact</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="employee-rows"></tbody>
      </table>
    </div>

    <!-- Hidden Creative Input Overlay Container (Modal) -->
    <div class="modal" id="addModal">
      <div class="modal-content">
        <h3>Add New Employee</h3>
        <form id="addEmployeeForm">
          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              id="newName"
              placeholder="e.g. John Doe"
              required
            />
          </div>
          <div class="form-group">
            <label>Position</label>
            <input
              type="text"
              id="newPosition"
              placeholder="e.g. Backend Developer"
              required
            />
          </div>
          <div class="form-group">
            <label>Department</label>
            <input
              type="text"
              id="newDepartment"
              placeholder="e.g. Engineering"
              required
            />
          </div>
          <div class="form-group">
            <label>Salary (R)</label>
            <input
              type="number"
              id="newSalary"
              placeholder="e.g. 65000"
              min="0"
              step="1"
              required
            />
          </div>
          <div class="form-group">
            <label>Employment History</label>
            <input
              type="text"
              id="newHistory"
              placeholder="e.g., Joined in 2026"
              required
            />
          </div>
          <div class="form-group">
            <label>Contact Email</label>
            <input
              type="email"
              id="newContact"
              placeholder="e.g. john.doe@moderntech.com"
              required
            />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-cancel" id="closeModalBtn">
              Cancel
            </button>
            <button type="submit" class="btn btn-add">Save Employee</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // ---- Live employee data, fetched from the API ----
      let employees = [];
      let isEditing = false;

      const tableBody = document.getElementById("employee-rows");
      const employeeBtn = document.getElementById("employeeBtn");
      const addEmployeeBtn = document.getElementById("addEmployeeBtn");
      const resetBtn = document.getElementById("resetBtn");
      const addModal = document.getElementById("addModal");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const addEmployeeForm = document.getElementById("addEmployeeForm");

      // ---- Validation ----
      const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function validateEmployee(emp) {
        if (!emp.name || !emp.name.trim()) return "Name cannot be empty.";
        if (!emp.position || !emp.position.trim()) return "Position cannot be empty.";
        if (!emp.department || !emp.department.trim()) return "Department cannot be empty.";
        if (isNaN(emp.salary) || emp.salary < 0) return "Salary must be a number of 0 or more.";
        if (!emp.contact || !EMAIL_PATTERN.test(emp.contact.trim())) {
          return "Contact must be a valid email address.";
        }
        return null;
      }

      // Maps the API's DB-shaped row to what this page's UI expects.
      function toViewModel(row) {
        return {
          employeeId: row.employee_id,
          name: row.name,
          position: row.position,
          department: row.department_name || "",
          salary: Number(row.salary),
          employmentHistory: row.employment_history || "",
          contact: row.contact,
        };
      }

      async function loadEmployees() {
        try {
          const rows = await apiRequest("/employees");
          employees = (rows || []).map(toViewModel);
          renderTable();
        } catch (err) {
          alert("Could not load employees: " + err.message);
        }
      }

      function renderTable() {
        tableBody.innerHTML = "";
        employees.forEach((employee) => {
          const row = document.createElement("tr");

          if (isEditing) {
            row.innerHTML = `
              <td>${employee.employeeId}</td>
              <td><input type="text" class="edit-input" data-id="${employee.employeeId}" data-field="name" value="${employee.name}"></td>
              <td><input type="text" class="edit-input" data-id="${employee.employeeId}" data-field="position" value="${employee.position}"></td>
              <td><input type="text" class="edit-input" data-id="${employee.employeeId}" data-field="department" value="${employee.department}"></td>
              <td><input type="number" class="edit-input" data-id="${employee.employeeId}" data-field="salary" min="0" value="${employee.salary}"></td>
              <td><input type="text" class="edit-input" data-id="${employee.employeeId}" data-field="employmentHistory" value="${employee.employmentHistory}"></td>
              <td><input type="email" class="edit-input" data-id="${employee.employeeId}" data-field="contact" value="${employee.contact}"></td>
              <td class="text-center">
                <button class="btn-delete" onclick="deleteEmployee(${employee.employeeId})">Delete</button>
              </td>
            `;
          } else {
            row.innerHTML = `
              <td>${employee.employeeId}</td>
              <td><strong>${employee.name}</strong></td>
              <td>${employee.position}</td>
              <td><span class="dept-tag">${employee.department}</span></td>
              <td>R ${employee.salary.toLocaleString()}</td>
              <td>${employee.employmentHistory}</td>
              <td><a href="mailto:${employee.contact}">${employee.contact}</a></td>
              <td class="text-center">
                <button class="btn-delete" onclick="deleteEmployee(${employee.employeeId})">Delete</button>
              </td>
            `;
          }
          tableBody.appendChild(row);
        });
      }

      async function deleteEmployee(id) {
        const target = employees.find((emp) => emp.employeeId === id);
        if (!target) return;

        const confirmDelete = confirm(
          `Are you sure you want to remove ${target.name} from the system?`,
        );
        if (!confirmDelete) return;

        try {
          await apiRequest(`/employees/${id}`, { method: "DELETE" });
          employees = employees.filter((emp) => emp.employeeId !== id);
          renderTable();
        } catch (err) {
          alert("Could not delete employee: " + err.message);
        }
      }

      // Validates all edited rows, then PUTs each changed one. Stops (and
      // stays in edit mode) on the first invalid row so nothing is lost.
      async function saveChanges() {
        const inputs = document.querySelectorAll(".edit-input");
        const draft = JSON.parse(JSON.stringify(employees));

        inputs.forEach((input) => {
          const id = parseInt(input.getAttribute("data-id"));
          const field = input.getAttribute("data-field");
          let value = input.value;
          const employee = draft.find((emp) => emp.employeeId === id);
          if (employee) {
            if (field === "salary") value = parseFloat(value);
            employee[field] = value;
          }
        });

        for (const employee of draft) {
          const error = validateEmployee(employee);
          if (error) {
            alert(`Could not save: ${employee.name || "an employee"} — ${error}`);
            return false;
          }
        }

        try {
          await Promise.all(
            draft.map((employee) =>
              apiRequest(`/employees/${employee.employeeId}`, {
                method: "PUT",
                body: {
                  name: employee.name,
                  position: employee.position,
                  department: employee.department,
                  salary: employee.salary,
                  employmentHistory: employee.employmentHistory,
                  contact: employee.contact,
                },
              }),
            ),
          );
          employees = draft;
          return true;
        } catch (err) {
          alert("Could not save changes: " + err.message);
          return false;
        }
      }

      employeeBtn.addEventListener("click", async () => {
        if (!isEditing) {
          isEditing = true;
          employeeBtn.textContent = "Save Changes";
          employeeBtn.style.backgroundColor = "var(--success)";
          employeeBtn.style.color = "#ffffff";
          employeeBtn.style.borderColor = "transparent";
          renderTable();
        } else {
          const saved = await saveChanges();
          if (!saved) return; // stay in edit mode so the user can fix the field
          isEditing = false;
          employeeBtn.textContent = "Edit Employees";
          employeeBtn.style.backgroundColor = "";
          employeeBtn.style.color = "";
          employeeBtn.style.borderColor = "";
          renderTable();
        }
      });

      addEmployeeBtn.addEventListener("click", () => {
        if (isEditing) {
          alert("Please save your current edits before adding a new employee.");
          return;
        }
        addModal.style.display = "flex";
      });

      closeModalBtn.addEventListener("click", () => {
        addModal.style.display = "none";
        addEmployeeForm.reset();
      });

      addEmployeeForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const newEmployee = {
          name: document.getElementById("newName").value.trim(),
          position: document.getElementById("newPosition").value.trim(),
          department: document.getElementById("newDepartment").value.trim(),
          salary: parseFloat(document.getElementById("newSalary").value),
          employmentHistory: document.getElementById("newHistory").value.trim(),
          contact: document.getElementById("newContact").value.trim(),
        };

        const error = validateEmployee(newEmployee);
        if (error) {
          alert(`Could not add employee: ${error}`);
          return;
        }

        try {
          const created = await apiRequest("/employees", {
            method: "POST",
            body: newEmployee,
          });
          employees.push(toViewModel(created));
          renderTable();
          addModal.style.display = "none";
          addEmployeeForm.reset();
        } catch (err) {
          alert("Could not add employee: " + err.message);
        }
      });

      // "Reset to Defaults" now means "discard local edits and reload from
      // the server" — the server is the source of truth, so there's no
      // local demo dataset to restore to anymore.
      resetBtn.addEventListener("click", async () => {
        const confirmReset = confirm(
          "This will discard any unsaved edits and reload employees from the server. Continue?",
        );
        if (!confirmReset) return;

        isEditing = false;
        employeeBtn.textContent = "Edit Employees";
        employeeBtn.style.backgroundColor = "";
        employeeBtn.style.color = "";
        employeeBtn.style.borderColor = "";
        await loadEmployees();
      });

      // ---- Lifecycle ----
      loadEmployees();
    </script>
    <script src="js/nav.js"></script>
  </body>
</html>
